name: Build RP2040 Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в интерфейсе

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Автоматически подтянет субмодули, если они есть

    - name: Install ARM Compiler and CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake

    - name: Set up Pico SDK
      run: |
        git clone --depth 1 --branch master https://github.com ${{ github.workspace }}/pico-sdk
        cd ${{ github.workspace }}/pico-sdk
        git submodule update --init
        echo "PICO_SDK_PATH=${{ github.workspace }}/pico-sdk" >> $GITHUB_ENV

    - name: Create Build Directory
      run: mkdir ${{ github.workspace }}/build

    - name: Configure CMake
      run: |
        cd ${{ github.workspace }}/build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build Firmware
      run: |
        cd ${{ github.workspace }}/build
        make -j$(nproc)

    - name: Upload UF2 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rp2040-usbnet-firmware
        path: |
          ${{ github.workspace }}/build/**/*.uf2
          ${{ github.workspace }}/build/**/*.bin
